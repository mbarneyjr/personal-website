name: ci-pr

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
    branches:
      - main
      - feature/*

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  TARGET_ACCOUNT_ID: ${{ secrets.DEV_ACCOUNT_ID }}
  COLUMNS: 160

permissions:
  id-token: write
  contents: read
  pull-requests: write

defaults:
  run:
    shell: nix develop --command bash -e {0}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: |
          ./scripts/test.sh
  deploy_pr:
    needs: [check]
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT_NAME: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
      - name: Assume role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ env.TARGET_ACCOUNT_ID }}:role/github-actions
          role-session-name: GitHubActions-${{ github.run_id }}
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          cache: npm
      - name: Install
        run: npm ci
      - name: Deploy
        run: |
          ./scripts/deploy.sh "${ENVIRONMENT_NAME}"
      - name: Comment URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${ENVIRONMENT_NAME}" --edit-last --create-if-none \
            --body "Deployed to https://${ENVIRONMENT_NAME}.dev.barney.dev/"
