name: cleanup-pr

on:
  pull_request:
    types:
      - closed
    branches:
      - main
      - feature/*

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  TARGET_ACCOUNT_ID: ${{ secrets.DEV_ACCOUNT_ID }}

permissions:
  id-token: write
  contents: write
  packages: read

defaults:
  run:
    shell: nix develop --command bash -e {0}

jobs:
  cleanup_pr:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT_NAME: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
      - name: Assume role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ env.TARGET_ACCOUNT_ID }}:role/github-actions
          role-session-name: GitHubActions-${{ github.run_id }}
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - uses: actions/setup-node@v7
        with:
          cache: npm
      - name: Install
        run: npm ci
      - name: Teardown
        run: |
          ./scripts/teardown.sh "${ENVIRONMENT_NAME}"
