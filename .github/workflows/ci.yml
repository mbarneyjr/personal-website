name: ci

on:
  push: {}

permissions:
  contents: read

defaults:
  run:
    shell: nix develop --command bash -e {0}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - uses: actions/setup-node@v7
        with:
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: |
          ./scripts/test.sh
