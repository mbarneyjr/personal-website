name: cleanup-pr

on:
  pull_request:
    types:
      - closed
      - unlabeled
    branches:
      - main
      - feature/*

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  TARGET_ACCOUNT_ID: ${{ secrets.DEV_ACCOUNT_ID }}

permissions:
  id-token: write
  contents: write
  packages: read
  pull-requests: write

defaults:
  run:
    shell: nix develop --command bash -e {0}

jobs:
  cleanup_pr:
    if: >-
      (github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'ci:deploy-preview')) ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'ci:deploy-preview' && github.event.pull_request.state == 'open')
    runs-on: ubuntu-24.04-arm
    env:
      ENVIRONMENT_NAME: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
      - name: Assume role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ env.TARGET_ACCOUNT_ID }}:role/github-actions
          role-session-name: GitHubActions-${{ github.run_id }}
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/setup-node@v7
        with:
          cache: npm
      - name: Install
        run: npm ci
      - name: Teardown
        run: |
          ./scripts/teardown.sh "${ENVIRONMENT_NAME}"
      - name: Comment teardown
        uses: ./.github/actions/pr-comment
        with:
          marker: ci:deploy-preview
          body: Preview environment torn down.
